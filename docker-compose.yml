services:
  backend:
    build: ./backend
    container_name: finanzapp-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./frontend/dist:/app/frontend/dist
      - ./templates:/app/templates
    ports:
      - "8090:8090"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - finanzapp-net

networks:
  finanzapp-net:
    external: true

